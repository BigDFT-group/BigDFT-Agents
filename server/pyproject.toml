[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "irene-mcp"
version = "0.2.6"
description = "MCP server for BigDFT-Agents: laraq BigDFT Python code generation, validation, and execution. Cluster access moved to HPC Rookery."
requires-python = ">=3.10"
dependencies = [
    # laraq_mcp's own direct dependencies, listed explicitly rather than
    # relying on what something else pulls in transitively. Pinned exactly
    # for the reason mcp already demonstrated once: mcp 2.0.0 renamed
    # mcp.server.fastmcp.FastMCP to mcp.server.mcpserver.MCPServer with no
    # deprecation window, so a range here carries the same risk it did
    # before that migration.
    #
    # hpc-agent-core is deliberately absent: it existed for irene_mcp, which
    # moved to HPC Rookery. laraq_mcp imports no hpc_agent_core.
    "mcp==2.0.0",
    "httpx",
    "numpy",
    "pydantic",
    "pyflakes",
]

[project.scripts]
laraq-mcp = "laraq_mcp.server:main"
laraq-doctor = "laraq_mcp.doctor:main"

[tool.setuptools.packages.find]
include = ["laraq_mcp*"]

[tool.setuptools.package-data]
laraq_mcp = [
    "data/docs/**/*.md",
    "data/docs/**/*.txt",
    "data/docs_index/**/*.json",
    "data/docs_index/**/*.npy",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
